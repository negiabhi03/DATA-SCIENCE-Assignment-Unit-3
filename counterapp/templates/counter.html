<style>
    body {
        background: linear-gradient(135deg, #f5f0ff, #ffffff);
        font-family: Arial, sans-serif;
        padding: 40px;
        margin: 0;
    }

    .title {
        text-align: center;
        color: #6d28d9;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    .counter-box {
        background-color: white;
        padding: 30px;
        border-radius: 18px;
        max-width: 800px;
        margin: auto;
        box-shadow: 0 8px 25px rgba(109, 40, 217, 0.15);
        border: 1px solid #e9d5ff;
    }

    .result {
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: white;
        padding: 18px;
        border-radius: 14px;
        max-width: 800px;
        margin: 0 auto 20px auto;
        text-align: center;
        box-shadow: 0 5px 15px rgba(109, 40, 217, 0.25);
    }

    .result p {
        font-size: 22px;
        margin: 0;
        font-weight: bold;
    }

    label {
        display: block;
        color: #4c1d95;
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    textarea {
        width: 100%;
        padding: 14px;
        border: 2px solid #ddd6fe;
        border-radius: 10px;
        font-size: 16px;
        box-sizing: border-box;
        resize: vertical;
        outline: none;
    }

    textarea:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 5px rgba(139, 92, 246, 0.3);
    }

    button {
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: 0.2s;
    }

    button:hover {
        background: linear-gradient(135deg, #6d28d9, #5b21b6);
        transform: translateY(-1px);
    }

    .footer {
        text-align: center;
        color: #7c3aed;
        margin-top: 20px;
        font-size: 14px;
    }
</style>

<div class="title">
    Word Counter
</div>

{% if i %}
<div class="result">
    <p>{{ word }} Word{{ word|pluralize }} in the text</p>
</div>
{% endif %}

<div class="counter-box">
    <form action="counter" method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="text1">Paste your text here</label>

            <textarea
                name="texttocount"
                id="text1"
                rows="10"
                placeholder="Enter your text here...">{{ text }}</textarea>
        </div>

        <br>

        <div style="text-align: center;">
            <button type="submit">Run Counter</button>
        </div>
    </form>
</div>

<div class="footer">
    Simple Word Counter • Built with Django
</div>
